name: Build Debug APK

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Only what the release step needs. The default would do, but saying it here means
    # the token cannot quietly gain more when GitHub changes its defaults.
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # The repository intentionally ships no Gradle wrapper binary, so Gradle is
      # provisioned by the setup action instead of `./gradlew`.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      # Compiler diagnostics are re-printed at the very end of the step so that a
      # failure is legible from the log tail instead of buried under a stack trace.
      - name: Compile
        run: |
          set -o pipefail
          if ! gradle :app:compileDebugKotlin --console=plain 2>&1 | tee compile.log; then
            echo "::group::Kotlin diagnostics"
            grep -E '^(e|w): ' compile.log | head -120 || true
            echo "::endgroup::"
            echo "---- COMPILE ERRORS ----"
            grep -E '^e: ' compile.log | head -80 || echo "(no 'e:' lines; see full log)"
            exit 1
          fi

      # Gradle's console output names the failing test and the line it failed on,
      # and stops there. The message — which is the part that says what actually
      # went wrong — only exists in the JUnit XML. Several rounds were lost to
      # diagnosing an exception whose text nobody could read, so the reports are
      # parsed here and printed in full.
      - name: Run unit tests
        run: |
          set -o pipefail
          if ! gradle :app:testDebugUnitTest --console=plain 2>&1 | tee test.log; then
            echo "---- TEST FAILURES ----"
            python3 - <<'PYEOF' || true
          import glob, xml.etree.ElementTree as ET
          shown = 0
          for path in sorted(glob.glob("app/build/test-results/**/*.xml", recursive=True)):
              try:
                  root = ET.parse(path).getroot()
              except Exception:
                  continue
              for case in root.iter("testcase"):
                  for bad in list(case.findall("failure")) + list(case.findall("error")):
                      shown += 1
                      print("=" * 70)
                      print(f"{case.get('classname')} > {case.get('name')}")
                      print("-" * 70)
                      print((bad.get("message") or "").strip())
                      trace = (bad.text or "").strip().splitlines()
                      for line in trace[:25]:
                          print("    " + line)
                      print()
          if shown == 0:
              print("(no failures in the XML reports; see the log above)")
          PYEOF
            exit 1
          fi

      - name: Android lint
        run: gradle :app:lintDebug --console=plain

      - name: Build debug APK
        run: gradle :app:assembleDebug --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      # An Actions artifact is a zip behind a login wall, and the section it appears in
      # does not render on a phone at all — which for a project developed entirely on
      # one makes every green build undeliverable. A release asset is a plain .apk on a
      # plain page: one tap to install, no account, no unzipping.
      #
      # Publish a commit-addressed release first. A failed upload must not remove the
      # previous working APK. The rolling page remains available, with older assets
      # retained so links in earlier conversations keep working.
      - name: Publish the APK somewhere a phone can reach it
        if: success() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          short="${GITHUB_SHA::7}"
          apk="custom-keyboard-${short}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$apk"

          tag="build-$(printf '%s' "$GITHUB_REF_NAME" | tr '/' '-')"
          stable="build-${GITHUB_SHA}"
          subject="$(git log -1 --pretty=%s)"
          export APK_FILE="$apk" RELEASE_SUBJECT="$subject"
          python3 - <<'PY'
          import os
          from pathlib import Path
          Path('release-notes.md').write_text(
              f"Debug build of `{os.environ['GITHUB_SHA'][:7]}`; tests and Android lint passed.\n\n"
              f"{os.environ['RELEASE_SUBJECT']}\n\n"
              f"Install `{os.environ['APK_FILE']}` below. Compatible earlier builds can be updated "
              "in place; the package and signing identity are preserved. If Android reports "
              "a signature mismatch, preserve your data before replacing the app. Uninstalling "
              "deletes local settings and the device-bound vault.\n"
          )
          PY
          if gh release view "$stable" >/dev/null 2>&1; then
            # Idempotent reruns: preserve a completed archive; finish an interrupted upload.
            if ! gh release view "$stable" --json assets --jq '.assets[].name' | grep -Fxq "$apk"; then
              gh release upload "$stable" "$apk"
            fi
          else
            gh release create "$stable" "$apk" --target "$GITHUB_SHA" --prerelease \
              --title "IO Matrix — $short" --notes-file release-notes.md
          fi
          gh release edit "$stable" --draft=false --prerelease
          if gh release view "$tag" >/dev/null 2>&1; then
            if ! gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fxq "$apk"; then
              gh release upload "$tag" "$apk"
            fi
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" \
              -f sha="$GITHUB_SHA" -F force=true
            gh release edit "$tag" --target "$GITHUB_SHA" --title "Latest build — $GITHUB_REF_NAME" --notes-file release-notes.md
          else
            gh release create "$tag" "$apk" --target "$GITHUB_SHA" --prerelease \
              --title "Latest build — $GITHUB_REF_NAME" --notes-file release-notes.md
          fi

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
