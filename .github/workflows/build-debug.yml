name: Build Debug APK

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # The repository intentionally ships no Gradle wrapper binary, so Gradle is
      # provisioned by the setup action instead of `./gradlew`.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      # Compiler diagnostics are re-printed at the very end of the step so that a
      # failure is legible from the log tail instead of buried under a stack trace.
      - name: Compile
        run: |
          set -o pipefail
          if ! gradle :app:compileDebugKotlin --console=plain 2>&1 | tee compile.log; then
            echo "::group::Kotlin diagnostics"
            grep -E '^(e|w): ' compile.log | head -120 || true
            echo "::endgroup::"
            echo "---- COMPILE ERRORS ----"
            grep -E '^e: ' compile.log | head -80 || echo "(no 'e:' lines; see full log)"
            exit 1
          fi

      - name: Run unit tests
        run: |
          set -o pipefail
          if ! gradle :app:testDebugUnitTest --console=plain 2>&1 | tee test.log; then
            echo "---- TEST FAILURES ----"
            grep -E 'FAILED|expected:|actual:|AssertionError|Exception' test.log | head -80 || true
            exit 1
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: app/build/reports/
          if-no-files-found: ignore
